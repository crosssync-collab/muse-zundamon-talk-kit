<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ずんだもん待機ページ</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:#f3f8f0;color:#22301f}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 44px}
.card{background:#fff;border:1px solid #d9e6d2;border-radius:16px;padding:16px;margin-top:14px}
.sub{color:#5a6b55;font-size:13px;line-height:1.7}
button{font:inherit;border:0;border-radius:999px;padding:12px 14px;cursor:pointer;background:#e7f2df;color:#22301f}
button:active{transform:scale(.98)}
.primary{background:#67b34a;color:#fff;font-weight:800;font-size:17px;width:100%;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid button{font-size:14px;padding:12px 6px}
.playing{outline:3px solid #67b34a}
h2{font-size:16px;margin:18px 0 10px}
#now{font-weight:800;font-size:17px}
#log{font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
.lamp{display:inline-block;width:12px;height:12px;border-radius:50%;background:#c0392b;vertical-align:middle;margin-right:6px}
.lamp.on{background:#67b34a}
</style></head><body><div class="wrap">
<h1 style="font-size:22px">ずんだもん待機ページ</h1>
<p class="sub">声はVOICEVOXの「ずんだもん」（ノーマル）音声なのだ。非公式ファンメイドなのだ。クレジット：VOICEVOX:ずんだもん。</p>
<div class="card">
<p style="margin:0 0 10px"><span class="lamp" id="lamp"></span><span id="conn">接続中…</span></p>
<button class="primary" id="enableBtn">音を有効にする（最初に1回だけタップ）</button>
<p class="sub" id="status">有効化すると確認で「了解なのだ」が鳴るのだ。その後は、AIアシスタントから合図が届くたびに、対応するフレーズが自動で鳴るのだ。このページは開いたまま、別アプリに切り替えて大丈夫なのだ。</p>
<p id="now">待機中なのだ</p>
<button id="stopBtn" style="width:100%">止める</button>
</div>
<div id="sections"></div>
<div class="card"><h2 style="margin-top:0">ログ</h2><div id="log"></div></div>
<audio id="player" preload="auto"></audio>
<audio id="keepalive" preload="auto" loop src="/keepalive.mp3"></audio>
<script>
const SAMPLES = __SAMPLES_JSON__;
const player = document.getElementById('player');
const keep = document.getElementById('keepalive');
const logEl = document.getElementById('log');
const nowEl = document.getElementById('now');
let enabled = false;
let playing = false;
let intentionalStop = false;
const playQueue = [];
function log(m){ const t=new Date().toLocaleTimeString('ja-JP'); logEl.textContent="["+t+"] "+m+"\n"+logEl.textContent; }
const DIAG_URL = "/diag";
function diag(ev, detail){
  const body = JSON.stringify({t:new Date().toISOString(), ev:ev, detail:detail||"", hidden:document.hidden, enabled:enabled});
  try{
    if(navigator.sendBeacon && navigator.sendBeacon(DIAG_URL, new Blob([body],{type:"text/plain"}))) return;
    fetch(DIAG_URL, {method:"POST", body:body, headers:{"Content-Type":"text/plain"}, keepalive:true}).catch(()=>{});
  }catch(e){}
}
function setupMediaSession(){
  if(!("mediaSession" in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({title:"ずんだもん待機中", artist:"VOICEVOX:ずんだもん", album:"ずんだもん待機ページ"});
    navigator.mediaSession.playbackState = "playing";
    const keepPlaying = ()=>{ if(enabled && !intentionalStop) keep.play().catch(()=>{}); };
    navigator.mediaSession.setActionHandler("play", keepPlaying);
    navigator.mediaSession.setActionHandler("pause", keepPlaying);
  }catch(e){ log("メディアセッションの設定で困ったのだ："+e.message); }
}
let resumeTimes = [], resumeCapped = false;
function resumeKeepalive(why){
  if(!enabled || intentionalStop || !keep.paused) return;
  const now = Date.now(); resumeTimes = resumeTimes.filter(t=> now - t < 600000);
  if(resumeTimes.length >= 6){
    if(!resumeCapped){ resumeCapped = true; log("他のアプリの音を邪魔しないよう、自動での鳴らし直しを止めたのだ。また鳴らしたくなったら有効化ボタンを押してほしいのだ"); diag("resume-capped", why); }
    return;
  }
  resumeTimes.push(now);
  log("居座り再生を再開するのだ（"+why+"）");
  diag("keepalive-resume", why);
  keep.play().catch(e=>{ log("居座り再生の再開に失敗したのだ："+e.name); diag("keepalive-resume-failed", why+" "+e.name); });
}
let lastAliveDiag = 0;
setInterval(()=>resumeKeepalive("timer"), 5000);
keep.addEventListener('pause', ()=>{
  if(enabled && !intentionalStop){
    log("居座り再生が止められたのだ");
    diag("keepalive-paused", "");
    setTimeout(()=>resumeKeepalive("pause-event"), 1500);
  }
});
keep.addEventListener('timeupdate', ()=>{
  if(Date.now() - lastAliveDiag > 60000){ lastAliveDiag = Date.now(); diag("alive", "ct="+Math.floor(keep.currentTime)); }
});
function enqueue(slug, why){
  if(!SAMPLES[slug]){ log("知らない合図だったのだ："+slug); return; }
  playQueue.push({slug:slug, why:why});
  pump();
}
function pump(){
  if(playing || playQueue.length===0) return;
  const item = playQueue.shift();
  const s = SAMPLES[item.slug];
  playing = true;
  document.querySelectorAll('button[data-key]').forEach(b=>b.classList.toggle('playing', b.dataset.key===item.slug));
  nowEl.textContent = "再生中："+s.text;
  player.src = "/samples/"+s.file;
  player.play().then(()=>log(item.why+"："+s.text)).catch(e=>{ log("再生できませんでした："+s.text+" / "+e.name); playing=false; pump(); });
}
player.addEventListener('ended', ()=>{ playing=false; document.querySelectorAll('button[data-key]').forEach(b=>b.classList.remove('playing')); nowEl.textContent="待機中なのだ"; pump(); });
player.addEventListener('error', ()=>{ if(playing){ playing=false; pump(); } });
const cats = [];
Object.values(SAMPLES).forEach(s=>{ if(!cats.includes(s.cat)) cats.push(s.cat); });
const sec = document.getElementById('sections');
cats.forEach(cat=>{
  const h=document.createElement('h2'); h.textContent=cat; sec.appendChild(h);
  const g=document.createElement('div'); g.className='grid';
  Object.keys(SAMPLES).filter(k=>SAMPLES[k].cat===cat).sort((a,b)=>SAMPLES[a].idx-SAMPLES[b].idx).forEach(k=>{
    const b=document.createElement('button'); b.textContent=SAMPLES[k].text; b.dataset.key=k;
    b.addEventListener('click', ()=>{ enabled=true; enqueue(k, "タップ再生"); });
    g.appendChild(b);
  });
  sec.appendChild(g);
});
document.getElementById('enableBtn').addEventListener('click', ()=>{
  enabled = true; intentionalStop = false;
  resumeTimes = []; resumeCapped = false;
  setupMediaSession();
  diag("enabled", "");
  document.getElementById('status').textContent = "音が有効になったのだ。合図が来たら自動で鳴るのだ。このまま別アプリに切り替えて大丈夫なのだ。";
  keep.play().then(()=>log("居座り再生を開始したのだ")).catch(e=>log("居座り再生は失敗したのだ："+e.name));
  enqueue("ryoukai", "有効化の確認再生");
});
document.getElementById('stopBtn').addEventListener('click', ()=>{ intentionalStop=true; player.pause(); keep.pause(); playQueue.length=0; playing=false; nowEl.textContent="止めたのだ"; log("止めたのだ"); if("mediaSession" in navigator){ try{ navigator.mediaSession.playbackState = "paused"; }catch(e){} } diag("stopped", ""); });
let lastSeq = 0, openedOnce = false;
function catchUp(why){
  fetch("/state").then(r=>r.json()).then(st=>{
    if(st && st.seq > lastSeq && st.slug && st.ts && (Date.now()/1000 - st.ts) < 120){
      lastSeq = st.seq;
      log("切れている間に届いていた合図なのだ："+st.slug);
      diag("catchup", why+" "+st.slug);
      if(enabled) enqueue(st.slug, "プッシュ再生");
      else log("まだ音が有効になっていないので鳴らさなかったのだ");
    }
  }).catch(()=>{});
}
const es = new EventSource("/events");
es.onopen = ()=>{
  document.getElementById('lamp').classList.add('on');
  document.getElementById('conn').textContent="合図の接続がつながっているのだ";
  log(openedOnce ? "合図の接続がつながり直したのだ" : "合図の接続がつながったのだ");
  diag(openedOnce ? "sse-reopen" : "sse-open", "");
  if(openedOnce) catchUp("reopen");
  openedOnce = true;
};
es.onerror = ()=>{ document.getElementById('lamp').classList.remove('on'); document.getElementById('conn').textContent="接続が切れたのでつなぎ直しているのだ…"; log("合図の接続が切れたのだ。再接続を試みるのだ"); diag("sse-error", ""); };
es.onmessage = (ev)=>{
  try{
    const obj = JSON.parse(ev.data);
    if(obj.seq) lastSeq = obj.seq;
    if(obj.slug){
      log("合図が届いたのだ："+obj.slug);
      diag("cue", obj.slug);
      if(enabled) enqueue(obj.slug, "プッシュ再生");
      else log("まだ音が有効になっていないので鳴らさなかったのだ");
    }
  }catch(e){ log("合図の解析に失敗したのだ"); }
};
document.addEventListener('visibilitychange', ()=>{
  log(document.hidden ? "ページが背面に回ったのだ" : "ページが前面に戻ったのだ");
  diag(document.hidden ? "hidden" : "visible", "");
  resumeKeepalive(document.hidden ? "hidden" : "visible");
  if(!document.hidden) catchUp("foreground");
});
log("待機ページを読み込んだのだ");
diag("load", "");
catchUp("load");
</script></div></body></html>
